[pytest]
# Включаем асинхронный режим по умолчанию
asyncio_mode = auto

# Таймаут для тестов (в секундах)
timeout = 30

# Показывать предупреждения
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::UserWarning

# Маркеры для тестов
markers =
    integration: Tests that require external services (like RabbitMQ)
    slow: Tests that are known to be slow